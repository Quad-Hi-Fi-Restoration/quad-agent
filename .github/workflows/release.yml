name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_repo.py
      - run: python scripts/package_skill.py
      - run: python -m zipfile -t dist/quad-upgrade.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/quad-upgrade.zip
          generate_release_notes: true
